{% extends 'base.html' %}

{% block content %}

<style>
    .detail-container {
        max-width: 850px;
        margin: 50px auto;
        padding: 30px;
        background: #fff5df;
        border-radius: 18px;
        border: 1px solid #d8b98a;
        box-shadow: 0 5px 20px rgba(80, 50, 20, 0.15);
    }

    .detail-title {
        color: #3b6b3f;
        font-size: 38px;
        margin-bottom: 15px;
        text-align: center;
    }

    .detail-date {
        text-align: center;
        color: #8b6b3e;
        margin-bottom: 30px;
        font-size: 15px;
    }

    .detail-content {
        color: #4b2e1f;
        line-height: 2;
        font-size: 18px;
        text-align: justify;
    }

    .back-btn {
        display: inline-block;
        margin-top: 35px;
        background: #3b6b3f;
        color: white;
        padding: 12px 25px;
        border-radius: 25px;
        text-decoration: none;
        transition: 0.3s;
    }

    .back-btn:hover {
        background: #4b2e1f;
    }

</style>


<div class="detail-container">

    <h1 class="detail-title">
        {{ post.title }}
    </h1>


    <div class="detail-date">
        تاریخ انتشار:
        {{ post.created_at|date:"Y/m/d" }}
    </div>


    <div class="detail-content">
        {{ post.content|linebreaks }}
    </div>


    <a class="back-btn" href="{% url 'blog:post_list' %}">
        بازگشت به وبلاگ
    </a>

</div>


{% endblock %}
