{% extends "base.html" %}

{% block title %}
{{ post.title }} | مجله سلامت آویشن
{% endblock %}

{% block content %}

<section class="blog-detail-page" dir="rtl">
    <div class="container">

        <article class="blog-detail">

            {% if post.image %}
                <img
                    src="{{ post.image.url }}"
                    alt="{{ post.title }}"
                    class="blog-detail-image"
                >
            {% endif %}

            <div class="blog-detail-content">

                <div class="blog-card-date">
                    {{ post.created_at|date:"Y/m/d" }}
                </div>

                <h1>
                    {{ post.title }}
                </h1>

                <div class="blog-content-text">
                    {{ post.content|linebreaks }}
                </div>

                <a href="{% url 'blog:blog-page' %}">بازگشت به مجله سلامت</a>


            </div>
        </article>

    </div>
</section>

{% endblock %}
