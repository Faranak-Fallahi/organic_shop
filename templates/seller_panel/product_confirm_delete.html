{% extends 'base.html' %}

{% block title %}حذف محصول{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 550px;">
    <div class="card border-0 shadow-sm p-4 text-center" style="border-radius: 14px;">
        <div class="mb-3 text-danger">
            <i class="fa-solid fa-triangle-exclamation" style="font-size: 50px;"></i>
        </div>
        <h5 class="fw-bold mb-3">آیا از حذف این محصول اطمینان دارید؟</h5>
        <p class="text-muted mb-4">
            محصول «<strong>{{ product.title }}</strong>» به طور کامل حذف خواهد شد و این عملیات قابل بازگشت نیست.
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="d-flex justify-content-center gap-2">
                <button type="submit" class="btn btn-danger" style="border-radius: 8px; padding: 8px 22px;">
                    بله، حذف شود
                </button>
                <a href="{% url 'seller_panel:product_list' %}" class="btn btn-light" style="border-radius: 8px; padding: 8px 22px;">
                    انصراف
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
