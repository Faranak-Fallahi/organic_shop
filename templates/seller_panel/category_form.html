{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="container py-4" style="max-width: 600px;">
    <div class="card border-0 shadow-sm p-4" style="border-radius: 14px;">
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h4 class="fw-bold mb-0" style="color: #315c3c;">{{ page_title }}</h4>
            <a href="{% url 'seller_panel:category_list' %}" class="btn btn-sm btn-outline-secondary" style="border-radius: 6px;">
                بازگشت به لیست
            </a>
        </div>

        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary">{{ form.title.label }}</label>
                {{ form.title }}
                {{ form.title.errors }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold small text-secondary">{{ form.image.label }}</label>
                {{ form.image }}
                {% if category.image %}
                    <div class="mt-2">
                        <span class="small text-muted">تصویر فعلی:</span>
                        <img src="{{ category.image.url }}" alt="{{ category.title }}" style="width: 70px; height: 70px; object-fit: cover; border-radius: 8px;" class="ms-2">
                    </div>
                {% endif %}
                {{ form.image.errors }}
            </div>

            <div class="mt-4 pt-3 border-top d-flex gap-2">
                <button type="submit" class="btn" style="background-color: #315c3c; color: #fff; padding: 9px 24px; border-radius: 8px;">
                    ذخیره دسته‌بندی
                </button>
                <a href="{% url 'seller_panel:category_list' %}" class="btn btn-light" style="padding: 9px 20px; border-radius: 8px;">
                    انصراف
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
