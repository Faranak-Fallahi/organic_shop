{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="register-wrapper">
    <div class="register-card">
        <h2 class="register-title">بازیابی رمز عبور</h2>
        <p class="register-subtitle">شماره موبایل خود را وارد کنید تا کد تایید برایتان ارسال شود.</p>

        <form method="post" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label for="{{ form.phone.id_for_label }}" class="form-label">شماره موبایل</label>
                {{ form.phone }}
                {% if form.phone.errors %}
                    <div class="form-error">{{ form.phone.errors }}</div>
                {% endif %}
            </div>

            <button type="submit" class="register-btn">ارسال کد</button>
        </form>

        <div class="block-link" style="margin-top: 16px;">
            <a href="{% url 'accounts:login' %}">بازگشت به ورود</a>
        </div>
    </div>
</div>
{% endblock %}
